<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="950" viewBox="0 0 960 950" role="img" aria-label="Architecture: you watch a dashboard; on the rented GPU server a runner prompts four agents, whose tool calls pass a validator before reaching the library, notes, chat, claims board and game state; every event is logged to a run folder that the analysis reads to produce the report.">
    <style>
text { fill: #1b2330; font-family: "Segoe UI", Arial, sans-serif; }
.t { font-size: 14px; font-weight: 700; }
.s { font-size: 12px; fill: #5b6676; }
.m { font-size: 11.5px; font-family: Consolas, "Courier New", monospace; fill: #1b2330; }
.lbl { font-size: 11.5px; fill: #5b6676; font-style: italic; }
.code { fill: #e3edfb; stroke: #2f6fd0; stroke-width: 1.6; }
.model { fill: #e0f3e7; stroke: #2e8b57; stroke-width: 1.6; }
.file { fill: #fdeedd; stroke: #c26a12; stroke-width: 1.6; }
.opt { fill: #f0f2f5; stroke: #8a94a3; stroke-width: 1.6; stroke-dasharray: 6 4; }
.you { fill: #ffffff; stroke: #1b2330; stroke-width: 1.6; }
.frame { fill: none; stroke: #c3cad5; stroke-width: 2; }
.ln { fill: none; stroke: #7f8a9a; stroke-width: 1.5; }
.ln.dash { stroke-dasharray: 5 4; }
.head { fill: #7f8a9a; }
.frametitle { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; fill: #5b6676; }
</style>
<rect x="0" y="0" width="960" height="950" fill="#ffffff"/>
    <defs>
      <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" class="head"/>
      </marker>
    </defs>

    <!-- Top row: dashboard and you -->
    <rect class="code" x="40" y="20" width="260" height="60" rx="8"/>
    <text class="t" x="170" y="45" text-anchor="middle">DASHBOARD</text>
    <text class="s" x="170" y="64" text-anchor="middle">watch a run live · Stop button</text>

    <rect class="you" x="660" y="20" width="260" height="60" rx="8"/>
    <text class="t" x="790" y="45" text-anchor="middle">YOU</text>
    <text class="s" x="790" y="64" text-anchor="middle">in a browser</text>

    <path class="ln" d="M660,50 H302" marker-end="url(#ah)"/>
    <text class="lbl" x="480" y="42" text-anchor="middle">watch live</text>

    <path class="ln" d="M160,80 V148" marker-end="url(#ah)"/>
    <text class="lbl" x="170" y="104">Stop button creates</text>

    <!-- Dashboard reads logs, along the left edge -->
    <path class="ln dash" d="M70,735 H22 V58 H38" marker-end="url(#ah)"/>
    <text class="lbl" transform="translate(15,430) rotate(-90)" text-anchor="middle">dashboard reads the run logs</text>

    <!-- Server frame -->
    <rect class="frame" x="40" y="118" width="900" height="682" rx="12"/>
    <text class="frametitle" x="920" y="138" text-anchor="end">RENTED GPU SERVER · EVERYTHING RUNS HERE (§11)</text>

    <!-- STOP file + config -->
    <rect class="file" x="70" y="150" width="180" height="50" rx="6"/>
    <text class="m" x="160" y="172" text-anchor="middle">STOP file</text>
    <text class="s" x="160" y="189" text-anchor="middle">kill switch (§7)</text>

    <rect class="file" x="70" y="215" width="180" height="55" rx="6"/>
    <text class="m" x="160" y="237" text-anchor="middle">config.json</text>
    <text class="s" x="160" y="255" text-anchor="middle">group, seed, caps, commit</text>

    <path class="ln" d="M250,175 H318" marker-end="url(#ah)"/>
    <path class="ln" d="M250,242 H318" marker-end="url(#ah)"/>

    <!-- Runner -->
    <rect class="code" x="320" y="150" width="590" height="120" rx="8"/>
    <text class="t" x="340" y="175">RUNNER · the main loop (§5–7)</text>
    <text class="s" x="340" y="199">Turn scheduler: rotating order, ≤5 tool calls per turn, simultaneous game choices</text>
    <text class="s" x="340" y="221">Builds each prompt: rules + status block + last 20 messages + own notes</text>
    <text class="s" x="340" y="243">Before every turn: checks the caps and the STOP file, then the end reasons (§6)</text>

    <!-- Runner to agents bus -->
    <path class="ln" d="M615,270 V295"/>
    <path class="ln" d="M165,295 H825"/>
    <path class="ln" d="M165,295 V318" marker-end="url(#ah)"/>
    <path class="ln" d="M385,295 V318" marker-end="url(#ah)"/>
    <path class="ln" d="M605,295 V318" marker-end="url(#ah)"/>
    <path class="ln dash" d="M825,295 V318" marker-end="url(#ah)"/>
    <text class="lbl" x="625" y="288">prompt in, reply out</text>

    <!-- Agents -->
    <rect class="model" x="70" y="320" width="190" height="70" rx="8"/>
    <text class="t" x="165" y="348" text-anchor="middle">Agent A</text>
    <text class="s" x="165" y="370" text-anchor="middle">OpenRouter · company 1</text>

    <rect class="model" x="290" y="320" width="190" height="70" rx="8"/>
    <text class="t" x="385" y="348" text-anchor="middle">Agent B</text>
    <text class="s" x="385" y="370" text-anchor="middle">OpenRouter · company 2</text>

    <rect class="model" x="510" y="320" width="190" height="70" rx="8"/>
    <text class="t" x="605" y="348" text-anchor="middle">Agent C</text>
    <text class="s" x="605" y="370" text-anchor="middle">vLLM on this GPU · API key</text>

    <rect class="opt" x="730" y="320" width="190" height="70" rx="8"/>
    <text class="t" x="825" y="348" text-anchor="middle">Mediator</text>
    <text class="s" x="825" y="370" text-anchor="middle">mediator runs only · can't fish</text>

    <!-- Agents to validator -->
    <path class="ln" d="M165,390 V438" marker-end="url(#ah)"/>
    <path class="ln" d="M385,390 V438" marker-end="url(#ah)"/>
    <path class="ln" d="M605,390 V438" marker-end="url(#ah)"/>
    <path class="ln dash" d="M825,390 V438" marker-end="url(#ah)"/>
    <text class="lbl" x="175" y="420">tool calls</text>

    <!-- Validator -->
    <rect class="code" x="70" y="440" width="850" height="60" rx="8"/>
    <text class="t" x="495" y="465" text-anchor="middle">VALIDATOR · allowlist + argument checks (§9)</text>
    <text class="s" x="495" y="486" text-anchor="middle">allowed → runs the tool · rejected → readable error + error event, uses 1 of the 5 calls</text>

    <!-- Validator to tools bus -->
    <path class="ln" d="M495,500 V525"/>
    <path class="ln" d="M150,525 H838"/>
    <path class="ln" d="M150,525 V548" marker-end="url(#ah)"/>
    <path class="ln" d="M322,525 V548" marker-end="url(#ah)"/>
    <path class="ln" d="M494,525 V548" marker-end="url(#ah)"/>
    <path class="ln" d="M666,525 V548" marker-end="url(#ah)"/>
    <path class="ln" d="M838,525 V548" marker-end="url(#ah)"/>
    <text class="lbl" x="505" y="518">allowed calls</text>

    <!-- Tools -->
    <g>
      <rect class="code" x="70" y="550" width="160" height="100" rx="8"/>
      <text class="t" x="150" y="574" text-anchor="middle">Library</text>
      <text class="m" x="150" y="595" text-anchor="middle">search_library</text>
      <text class="m" x="150" y="613" text-anchor="middle">read_page</text>
      <text class="s" x="150" y="634" text-anchor="middle">~30 fictional pages</text>
    </g>
    <g>
      <rect class="code" x="242" y="550" width="160" height="100" rx="8"/>
      <text class="t" x="322" y="574" text-anchor="middle">Notes</text>
      <text class="m" x="322" y="595" text-anchor="middle">read_notes</text>
      <text class="m" x="322" y="613" text-anchor="middle">write_notes</text>
      <text class="s" x="322" y="634" text-anchor="middle">private · ≤500 words</text>
    </g>
    <g>
      <rect class="code" x="414" y="550" width="160" height="100" rx="8"/>
      <text class="t" x="494" y="574" text-anchor="middle">Group chat</text>
      <text class="m" x="494" y="595" text-anchor="middle">post_message</text>
      <text class="m" x="494" y="613" text-anchor="middle">chat.jsonl</text>
      <text class="s" x="494" y="634" text-anchor="middle">public · ≤300 words</text>
    </g>
    <g>
      <rect class="code" x="586" y="550" width="160" height="100" rx="8"/>
      <text class="t" x="666" y="574" text-anchor="middle">Claims board</text>
      <text class="m" x="666" y="595" text-anchor="middle">add_claim</text>
      <text class="m" x="666" y="613" text-anchor="middle">check_claim</text>
      <text class="m" x="666" y="631" text-anchor="middle">submit_section</text>
    </g>
    <g>
      <rect class="code" x="758" y="550" width="160" height="100" rx="8"/>
      <text class="t" x="838" y="574" text-anchor="middle">Game state</text>
      <text class="m" x="838" y="595" text-anchor="middle">choose_catch</text>
      <text class="m" x="838" y="613" text-anchor="middle">claim_units (B)</text>
      <text class="s" x="838" y="634" text-anchor="middle">lake or work-unit pool</text>
    </g>

    <!-- Tools to run folder -->
    <path class="ln" d="M494,650 V698" marker-end="url(#ah)"/>
    <text class="lbl" x="505" y="680">every event is logged</text>

    <!-- Run folder -->
    <rect class="file" x="70" y="700" width="850" height="70" rx="8"/>
    <text class="t" x="90" y="726">RUN FOLDER <tspan class="m" dx="6">runs/&lt;date_condition&gt;/</tspan></text>
    <text class="m" x="90" y="750">config.json · events.jsonl · chat.jsonl · prompts.jsonl · summary.json</text>

    <!-- Below the server -->
    <path class="ln" d="M300,770 V848" marker-end="url(#ah)"/>
    <text class="lbl" x="310" y="815">logs copied after the runs</text>

    <rect class="code" x="70" y="850" width="490" height="76" rx="8"/>
    <text class="t" x="90" y="876">ANALYSIS · on your laptop</text>
    <text class="s" x="90" y="896">scores every run with <tspan class="m">answer_key.json</tspan></text>
    <text class="s" x="90" y="914">(agents never see the answer key)</text>

    <path class="ln" d="M560,888 H638" marker-end="url(#ah)"/>

    <rect class="file" x="640" y="850" width="280" height="76" rx="8"/>
    <text class="t" x="660" y="876">RESULTS + REPORT</text>
    <text class="s" x="660" y="896">catch rates, rounds survived,</text>
    <text class="s" x="660" y="914">bootstrap ranges</text>
  </svg>
